# Packaged builds. Doc 12 phase 11.
#
# `tauri.conf.json` targets msi and dmg, so the two jobs below are the two
# platforms that produce them. Linux is not a target in v1 and is absent here
# rather than built and thrown away.
#
# Signing and notarisation are conditional on the certificates being present,
# and the job says in its output which one it produced. An unsigned build that
# claimed to be signed is worse than one that says it is not: on macOS the
# first thing a person learns is Gatekeeper refusing it, and by then they are
# holding a file nobody told them was unsigned.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.0'
        required: true
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # tauri-action opens the draft release, which is a write to the repository.
    permissions:
      contents: write
    strategy:
      # One platform failing should not cancel the other: knowing that the msi
      # built and the dmg did not is what tells you where to look.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: macos
            target: aarch64-apple-darwin
          - runner: windows-latest
            label: windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install the ui
        run: pnpm --dir app/ui install --frozen-lockfile

      # The whole workspace, not just the shell. A release built from a tree
      # whose tests were never run is a release nobody checked.
      - name: test
        run: cargo test --workspace

      # An empty secret is still a defined environment variable, and the Tauri
      # bundler reads presence rather than emptiness: the first run that got
      # this far ran `security import` on a blank certificate and failed
      # codesign after a clean six minute compile. So the answer becomes an
      # output and the signing variables are attached to one step or the other,
      # never set to nothing.
      - name: say whether this build will be signed
        id: signing
        shell: bash
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ "${{ matrix.label }}" = "macos" ]; then
            if [ -n "$APPLE_CERT" ]; then
              echo "signing and notarising with the Apple certificate"
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::no Apple certificate: this dmg is unsigned and Gatekeeper will refuse it"
              echo "signed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ -n "$WINDOWS_CERT" ]; then
              echo "signing with the Windows certificate"
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::no Windows certificate: this msi is unsigned and SmartScreen will warn"
              echo "signed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Two bundle steps rather than one with conditional variables, because
      # there is no way to leave an `env` key unset from an expression.
      #
      # GITHUB_TOKEN is what opens the draft release. Without it the Windows
      # job built `Tessera_0.1.0_x64_en-US.msi`, found it, and then failed on
      # `GITHUB_TOKEN is required`: an installer built and thrown away.
      - name: bundle, signed
        if: steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: app/src-tauri
          args: --target ${{ matrix.target }}
          # A draft, so a person looks at what was produced before anyone can
          # download it. Doc 12 phase 11's acceptance is a fresh install, and
          # nobody has performed one at this point in the workflow.
          releaseDraft: true
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Tessera ${{ inputs.tag || github.ref_name }}

      - name: bundle, unsigned
        if: steps.signing.outputs.signed == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          args: --target ${{ matrix.target }}
          releaseDraft: true
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Tessera ${{ inputs.tag || github.ref_name }}

      - name: keep the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.label }}
          # `app/src-tauri` is a member of the root workspace, so cargo writes
          # to `<repo>/target`, not to a target directory beside the crate.
          # This looked in the second place and found nothing on a run where
          # the msi had been built and named in the log directly above.
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 14
