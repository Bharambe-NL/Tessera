[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Doc 12 operating principle 1: validate at every boundary. A silent unwrap in a
# boundary crate is the failure mode that principle exists to prevent.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
tessera-schema = { path = "crates/tessera-schema" }
tessera-store = { path = "crates/tessera-store" }
tessera-harness = { path = "crates/tessera-harness" }
tessera-doctrine = { path = "crates/tessera-doctrine" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The "sweep hang" of BN-154, root caused 2026-08-30: it was never a hang. The
# candle embedding stack in an unoptimised debug build is orders of magnitude
# slower than release. Indexing the 185 file synthetic corpus takes about 90
# seconds optimised and did not finish in 13 minutes of six busy cores in
# debug, which is what every "hung" sweep, local and CI, was actually doing.
# Optimising dependencies alone keeps workspace crates debuggable and compiles
# once into the cache.
[profile.dev.package."*"]
opt-level = 2
