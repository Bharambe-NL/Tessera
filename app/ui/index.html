<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The webview loads no remote resource. IBM Plex is bundled from
         node_modules and served from the app's own origin, so `default-src
         'self'` covers the fonts and needs no `font-src` of its own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Tessera</title>
  </head>
  <body>
    <!-- Doc 11 section 5: left rail 56px collapsed, 240px open. Doc 09 open
         question 1, adopted by doc 11: Trash is a filter on Home, so it is
         absent here and present as a toggle on the Home page. -->
    <nav id="rail" aria-label="Sections" data-no-pan>
      <button class="rail-item on" data-view="board" aria-current="page">
        <span class="glyph" aria-hidden="true">▣</span><span class="label">Board</span>
      </button>
      <button class="rail-item" data-view="home">
        <span class="glyph" aria-hidden="true">▤</span><span class="label">Home</span>
      </button>
      <button class="rail-item" data-view="flags">
        <span class="glyph" aria-hidden="true">▲</span><span class="label">Flags</span>
        <span class="count" id="rail-flags" hidden></span>
      </button>
      <button class="rail-item" data-view="library">
        <span class="glyph" aria-hidden="true">▥</span><span class="label">Library</span>
      </button>
      <button class="rail-item" data-view="notebook">
        <span class="glyph" aria-hidden="true">▧</span><span class="label">Notebook</span>
      </button>
      <!-- Doc 16 section 3.7: the rail gains Pages. Doc 16 section 7 point 1
           keeps the words apart: a sticky is on a board, a page is in the vault. -->
      <button class="rail-item" data-view="pages">
        <span class="glyph" aria-hidden="true">▦</span><span class="label">Pages</span>
      </button>
      <button class="rail-item" data-view="profile">
        <span class="glyph" aria-hidden="true">◍</span><span class="label">Profile</span>
      </button>
      <button id="rail-toggle" class="rail-item wide" aria-expanded="false">
        <span class="glyph" aria-hidden="true">»</span><span class="label">Collapse</span>
      </button>
    </nav>

    <main id="main" aria-label="Board">
      <div id="grid" aria-hidden="true"></div>

      <div id="world">
        <svg id="edges" aria-hidden="true"></svg>
        <svg id="ink" aria-hidden="true"></svg>
        <div id="cards"></div>
        <!-- Doc 01 section 4.5's stickies. Above the cards, as the prototype's
             own z order has them, because a sticky is something a person put on
             top of the board. -->
        <div id="stickies"></div>
        <!-- Doc 16 section 3.6's four handles, as one overlay for the whole
             board rather than four buttons per card: the card markup is
             signature diffed and doc 12 phase 0's pan gate depends on it. -->
        <div id="handles" class="handles" data-no-pan hidden>
          <button type="button" data-side="top" tabindex="-1" aria-hidden="true">+</button>
          <button type="button" data-side="right" tabindex="-1" aria-hidden="true">+</button>
          <button type="button" data-side="bottom" tabindex="-1" aria-hidden="true">+</button>
          <button type="button" data-side="left" tabindex="-1" aria-hidden="true">+</button>
        </div>
      </div>

      <!-- Doc 11 section 5: mode indicator top left, board title centred at top,
           toolbar top right, composer bottom centre. -->
      <div id="mode" data-no-pan><span class="dot"></span><span id="mode-label">Starting</span></div>

      <div id="titlebar" data-no-pan>
        <input id="title" aria-label="Board title" value="Untitled board" />
        <!-- Doc 11 section 10: the canvas list view alternative, reachable from
             the title. A canvas is a spatial arrangement and a screen reader
             has no way to convey one, so the same cards render as a document. -->
        <button id="reading-toggle" aria-pressed="false">Read as a document</button>
        <!-- Doc 10 section 9: a pack update never rewrites a board's pinned
             version; the board offers "update pack", which reruns verify_only. -->
        <button id="pack-update" hidden></button>
      </div>

      <div id="toolbar" data-no-pan>
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="tidy">Tidy</button>
        <button id="fit">Fit</button>
        <!-- Doc 09 section 4: the exercise entry sits in the toolbar. -->
        <button id="check">Check understanding</button>
      </div>

      <div id="empty" hidden>Ask something to start a board.</div>

      <form id="composer" data-no-pan>
        <textarea id="ask" rows="1" placeholder="Ask something" aria-label="Ask a question"></textarea>
        <!-- Doc 14 section 4: a Learn toggle left of the depth selector. -->
        <button id="learn" type="button" aria-pressed="false">Learn</button>
        <div id="modes" role="group" aria-label="Depth">
          <button type="button" data-depth="fast" class="on">fast</button>
          <button type="button" data-depth="deep">deep</button>
          <button type="button" data-depth="research">research</button>
        </div>
        <button id="send" type="submit" aria-label="Send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
        </button>
      </form>

      <!-- Doc 09 section 3: the highlight popover and the block investigate
           popover. One element in two states, following the prototype: offer
           first, then compose. It sits outside #world on purpose, so it holds
           its size when the board is zoomed. -->
      <div id="anchor-pop" role="dialog" aria-label="Ask about this" data-no-pan hidden>
        <div class="offer">
          <span class="anchor-label"></span>
          <button id="anchor-ask" type="button"></button>
          <!-- Doc 16 section 3.6: "Add note" from the highlight menu, with the
               quote prefilled. -->
          <button id="anchor-note" type="button" hidden></button>
        </div>
        <form class="compose" hidden>
          <input id="anchor-question" aria-label="Ask about this" autocomplete="off" />
          <div class="acts">
            <button id="anchor-cancel" type="button">Not now</button>
            <button id="anchor-branch" type="submit" class="primary">Branch here</button>
          </div>
        </form>
      </div>

      <article id="reading" aria-label="This board as a document" tabindex="-1" data-no-pan hidden></article>

      <!-- Doc 14 section 3.9: the Tutor panel, right dock, 320px. Closing it
           ends the session and the board keeps everything. -->
      <aside id="tutor" aria-label="Tutor" data-no-pan hidden>
        <header>
          <span id="tutor-stage"></span>
          <button id="tutor-close" aria-label="End the session">✕</button>
        </header>
        <div id="tutor-body"></div>
      </aside>

      <!-- Doc 11 section 6: the exercise is a modal over the board, because it
           is a thing you do to a board rather than a place you go. -->
      <div id="exercise" role="dialog" aria-modal="true" aria-labelledby="ex-title" tabindex="-1" data-no-pan hidden>
        <div class="sheet">
          <header>
            <h2 id="ex-title">Check your understanding</h2>
            <button id="ex-dismiss" aria-label="Close">✕</button>
          </header>
          <div id="ex-body"></div>
        </div>
      </div>

      <div id="toasts" role="status" aria-live="polite"></div>
      <pre id="gate" hidden></pre>
    </main>

    <!-- The pages doc 11 section 6 lists, over the canvas rather than beside it,
         so the board keeps its own camera while a page is open. -->
    <section id="page" aria-live="polite" hidden>
      <header class="page-head">
        <h1 id="page-title"></h1>
        <div id="page-tools"></div>
      </header>
      <div id="page-body"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
