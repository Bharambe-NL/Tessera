[package]
name = "tessera-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.11.5"
tessera-core = { version = "0.1.0", path = "../../crates/tessera-core" }
tessera-providers = { version = "0.1.0", path = "../../crates/tessera-providers" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
