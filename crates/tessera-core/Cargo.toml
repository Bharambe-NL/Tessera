[package]
name = "tessera-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Doc 17 section 2.3 computes decay from a timestamp difference, and the two
# sides of that comparison are RFC 3339 strings the store wrote.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tessera-agents = { version = "0.1.0", path = "../tessera-agents" }
tessera-bundle = { version = "0.1.0", path = "../tessera-bundle" }
tessera-doctrine = { version = "0.1.0", path = "../tessera-doctrine" }
tessera-harness = { version = "0.1.0", path = "../tessera-harness" }
tessera-providers = { version = "0.1.0", path = "../tessera-providers" }
tessera-retrievers = { version = "0.1.0", path = "../tessera-retrievers" }
tessera-schema = { version = "0.1.0", path = "../tessera-schema" }
tessera-store = { version = "0.1.0", path = "../tessera-store" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
zip = "8.6.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
